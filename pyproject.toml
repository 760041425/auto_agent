[project]
name = "las-image-3d-query"
version = "0.1.0"
description = "LAS 点云影像 3D 坐标查询系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "python-multipart",
    "laspy>=2.5.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "kornia>=0.7.0",
    "romatch>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["api/tests", "services/tests"]
# pythonpath: 确保本地 scripts/ 优先于 site-packages/scripts（uniception 包会安装同名包到 site-packages）
pythonpath = ["."]
markers = [
    "integration: requires filesystem fixtures or boundary adapters",
    "slow: takes materially longer than the fast feedback loop",
    "system: starts processes, opens ports, or requires real runtime assets",
]
