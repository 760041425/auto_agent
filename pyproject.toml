[project]
name = "las-image-3d-query"
version = "0.1.0"
description = "LAS 点云影像 3D 坐标查询系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "python-multipart",
    "laspy>=2.5.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["api/tests", "services/tests"]
