<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 点云可视化（瓦片加载）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    #container { width: 100vw; height: 100vh; }
    #controls {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(30, 30, 50, 0.92); padding: 16px; border-radius: 8px;
      min-width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #controls h2 { font-size: 14px; margin-bottom: 12px; }
    .control-row { margin-bottom: 10px; }
    .control-row label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .control-row .value { color: #4fc3f7; }
    .control-row input[type="range"] { width: 100%; }
    button {
      width: 100%; padding: 8px; margin-top: 8px; border: none; border-radius: 4px;
      background: #1976d2; color: #fff; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #1565c0; }
    #stats {
      position: fixed; bottom: 16px; left: 16px; z-index: 10;
      background: rgba(30, 30, 50, 0.92); padding: 12px; border-radius: 6px;
      font-size: 12px; line-height: 1.6;
    }
    #stats span { color: #4fc3f7; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; color: #4fc3f7; }
    #tile-status {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      background: rgba(30, 30, 50, 0.92); padding: 10px 14px; border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <div id="controls">
    <h2>3D 点云（瓦片加载）</h2>
    <div class="control-row">
      <label>瓦片大小: <span class="value" id="tileSizeValue">50m</span></label>
      <input type="range" id="tileSize" min="10" max="100" step="10" value="50">
    </div>
    <div class="control-row">
      <label>每瓦片最大点数: <span class="value" id="maxPtsValue">50000</span></label>
      <input type="range" id="maxPts" min="5000" max="200000" step="5000" value="50000">
    </div>
    <div class="control-row">
      <label>点大小: <span class="value" id="sizeValue">1.0</span></label>
      <input type="range" id="pointSize" min="0.1" max="5" step="0.1" value="1.0">
    </div>
    <button id="reloadBtn">重新加载瓦片</button>
  </div>

  <div id="stats" style="display:none">
    总点数: <span id="totalPoints">-</span><br>
    瓦片数: <span id="tileCount">-</span><br>
    已加载: <span id="loadedTiles">-</span> 瓦片 / <span id="loadedPoints">-</span> 点
  </div>

  <div id="tile-status" style="display:none">加载中...</div>
  <div id="loading">加载瓦片列表...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let tileCache = {};       // { "ix,iy": THREE.Points }
    let tileMetadata = [];    // [{ix, iy, count, min, max}]
    let loadedTiles = new Set();
    let currentTileSize = 50;
    let currentMaxPts = 50000;
    let totalLoadedPts = 0;

    function init() {
      const container = document.getElementById('container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
      camera.position.set(100, 100, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      scene.add(new THREE.AxesHelper(50));
      scene.add(new THREE.GridHelper(300, 30, 0x444466, 0x333355));

      window.addEventListener('resize', onResize);
      controls.addEventListener('change', onCameraChange);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onCameraChange() {
      // 相机变化时，加载附近瓦片
      loadNearbyTiles();
    }

    async function loadTileList() {
      document.getElementById('loading').style.display = 'block';
      loadedTiles.clear();
      totalLoadedPts = 0;

      // 清除旧瓦片
      for (const key in tileCache) {
        scene.remove(tileCache[key]);
        tileCache[key].geometry.dispose();
        tileCache[key].material.dispose();
      }
      tileCache = {};

      try {
        const resp = await fetch(`/api/point-cloud/tiles?tile_size=${currentTileSize}`);
        const data = await resp.json();
        if (data.error) {
          document.getElementById('loading').textContent = '错误: ' + data.error;
          return;
        }
        tileMetadata = data.tiles;
        document.getElementById('totalPoints').textContent = data.total_points.toLocaleString();
        document.getElementById('tileCount').textContent = tileMetadata.length;
        document.getElementById('stats').style.display = 'block';
        document.getElementById('loading').style.display = 'none';

        // 加载初始瓦片
        loadNearbyTiles();
      } catch (e) {
        document.getElementById('loading').textContent = '加载失败: ' + e.message;
      }
    }

    async function loadNearbyTiles() {
      if (!tileMetadata.length) return;

      // 相机位置 → 瓦片索引
      const camX = controls.target.x;
      const camY = controls.target.y;
      const camIX = Math.floor(camX / currentTileSize);
      const camIY = Math.floor(camY / currentTileSize);

      // 加载周围 3x3 瓦片
      const wanted = new Set();
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          wanted.add(`${camIX + dx},${camIY + dy}`);
        }
      }

      // 卸载远处瓦片
      for (const key of loadedTiles) {
        if (!wanted.has(key)) {
          const obj = tileCache[key];
          if (obj) {
            scene.remove(obj);
            obj.geometry.dispose();
            obj.material.dispose();
            delete tileCache[key];
          }
          loadedTiles.delete(key);
        }
      }

      // 加载新瓦片
      let loaded = 0;
      for (const key of wanted) {
        if (loadedTiles.has(key)) continue;
        const [ix, iy] = key.split(',').map(Number);
        const meta = tileMetadata.find(t => t.ix === ix && t.iy === iy);
        if (!meta) continue;

        try {
          const resp = await fetch(`/api/point-cloud/tile/${ix}/${iy}?tile_size=${currentTileSize}&max_points=${currentMaxPts}`);
          const data = await resp.json();
          if (data.error || !data.points.length) continue;

          const positions = new Float32Array(data.points.flat());
          const colors = new Float32Array(data.colors.flat());

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          const material = new THREE.PointsMaterial({
            size: parseFloat(document.getElementById('pointSize').value),
            vertexColors: true,
            sizeAttenuation: true,
          });

          const points = new THREE.Points(geometry, material);
          scene.add(points);
          tileCache[key] = points;
          loadedTiles.add(key);
          totalLoadedPts += data.count;
          loaded++;
        } catch (e) {
          console.warn(`瓦片 ${key} 加载失败:`, e);
        }
      }

      if (loaded > 0) {
        document.getElementById('loadedTiles').textContent = loadedTiles.size;
        document.getElementById('loadedPoints').textContent = totalLoadedPts.toLocaleString();
      }
    }

    // 控件事件
    document.getElementById('tileSize').addEventListener('input', (e) => {
      document.getElementById('tileSizeValue').textContent = e.target.value + 'm';
      currentTileSize = parseFloat(e.target.value);
    });
    document.getElementById('maxPts').addEventListener('input', (e) => {
      document.getElementById('maxPtsValue').textContent = e.target.value;
      currentMaxPts = parseInt(e.target.value);
    });
    document.getElementById('reloadBtn').addEventListener('click', loadTileList);
    document.getElementById('pointSize').addEventListener('input', (e) => {
      document.getElementById('sizeValue').textContent = e.target.value;
      const size = parseFloat(e.target.value);
      for (const key in tileCache) tileCache[key].material.size = size;
    });

    // 初始化
    init();
    loadTileList();
  </script>
</body>
</html>
